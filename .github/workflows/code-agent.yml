# Code Agent
# Copy this file to your repo: .github/workflows/code-agent.yml
# Push to your base branch.
# Requires AGENTS_TOKEN secret (see docs/setup-guide.md)
#
# Triggers:
# - Add label "agent:implement" to an issue → agent implements it
# - Manual: Actions tab → Code Agent → Run workflow → enter issue number

name: Code Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Issue number to implement'
        required: true

jobs:
  implement:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:implement')
    runs-on: [self-hosted, macOS]

    steps:
      # Self-hosted macOS: actions/checkout@v4 often fails with
      # "Missing file .../_runner_file_commands/set_output" after git already succeeded.
      - name: Checkout repo
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          git config --global --add safe.directory "${{ github.workspace }}"
          ORIGIN="https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/${{ github.repository }}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "$ORIGIN"
          else
            git remote set-url origin "$ORIGIN"
          fi
          git fetch origin --prune
          git checkout -f "${{ github.sha }}"

      - name: Configure git for push
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/${{ github.repository }}.git"
          GIT_USER=$(gh api user --jq '.login' 2>/dev/null || echo "code-agent[bot]")
          GIT_EMAIL=$(gh api user --jq '.email // (.login + "@users.noreply.github.com")' 2>/dev/null || echo "code-agent[bot]@users.noreply.github.com")
          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"
        env:
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}

      - name: Pull agent code
        run: |
          rm -rf /tmp/innovation-agents
          git clone --depth 1 https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/ad-net/innovation-agents.git /tmp/innovation-agents

      - name: Run Code Agent
        run: |
          chmod +x /tmp/innovation-agents/actions/code-agent/entrypoint.sh
          /tmp/innovation-agents/actions/code-agent/entrypoint.sh
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue-number || github.event.issue.number }}
          MAX_TURNS: '100'
          ACTION_PATH: /tmp/innovation-agents/actions/code-agent
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}
