# QA Agent
# Copy this file to your repo: .github/workflows/qa-agent.yml
# Push to your base branch.
# Requires AGENTS_TOKEN secret (see docs/setup-guide.md).
# E2E browser: runner needs Bun (https://bun.sh) so gstack can build on first run; after that
# scripts/ensure-gstack-browse.sh exits immediately if browse is already installed.

name: QA Agent

on:
  push:

jobs:
  qa:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Pull agent code
        run: |
          rm -rf /tmp/innovation-agents
          git clone --depth 1 https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/ad-net/innovation-agents.git /tmp/innovation-agents

      # Invoke entrypoint directly (same pattern as pr-agent.yml). Local composite
      # `uses:` paths must be under the checked-out repo — /tmp/... is not valid.
      - name: Run QA Agent
        run: |
          chmod +x /tmp/innovation-agents/actions/qa/entrypoint.sh
          chmod +x /tmp/innovation-agents/scripts/ensure-gstack-browse.sh
          /tmp/innovation-agents/actions/qa/entrypoint.sh
        env:
          QA_SHA: ${{ github.sha }}
          MAX_QA_TURNS: '50'
          ACTION_PATH: /tmp/innovation-agents/actions/qa
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}
          BASE_BRANCH: 'master'
          QA_BOOTSTRAP_GSTACK: '1'
