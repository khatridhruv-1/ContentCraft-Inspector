# PR Review & Fix Agent + auto-close issues on merge to agent-implement
# Copy this file to your repo: .github/workflows/pr-agent.yml
# Requires AGENTS_TOKEN secret (see docs/setup-guide.md)

name: PR Review & Fix Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  pr-review:
    # Review on open/update only; skip agent-pipeline PRs (scheduler handles those)
    if: >-
      github.event.action != 'closed' &&
      !startsWith(github.event.pull_request.head.ref, 'code-agent/')
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repo
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          git config --global --add safe.directory "${{ github.workspace }}"
          ORIGIN="https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/${{ github.repository }}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "$ORIGIN"
          else
            git remote set-url origin "$ORIGIN"
          fi
          git fetch origin --prune

      - name: Checkout PR branch
        run: gh pr checkout ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}

      - name: Pull agent code
        run: |
          rm -rf /tmp/innovation-agents
          git clone --depth 1 https://x-access-token:${{ secrets.AGENTS_TOKEN }}@github.com/ad-net/innovation-agents.git /tmp/innovation-agents

      - name: Run PR Review & Fix Agent
        run: |
          chmod +x /tmp/innovation-agents/actions/pr-review-fix/entrypoint.sh
          chmod +x /tmp/innovation-agents/scripts/notify-slack.sh
          /tmp/innovation-agents/actions/pr-review-fix/entrypoint.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_CYCLES: '5'
          MAX_REVIEW_TURNS: '30'
          MAX_FIX_TURNS: '50'
          ACTION_PATH: /tmp/innovation-agents/actions/pr-review-fix
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_NOTIFY_USER_ID: ${{ secrets.SLACK_NOTIFY_USER_ID }}

  close-issues:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'agent-implement'
    runs-on: ubuntu-latest

    steps:
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ secrets.AGENTS_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AGENT_BASE_BRANCH: agent-implement
          PR_MERGED_FROM_EVENT: "true"
          PR_BASE_REF_FROM_EVENT: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          rm -rf /tmp/innovation-agents
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/ad-net/innovation-agents.git" \
            /tmp/innovation-agents
          chmod +x /tmp/innovation-agents/scripts/close-issues-on-merge.sh
          /tmp/innovation-agents/scripts/close-issues-on-merge.sh
